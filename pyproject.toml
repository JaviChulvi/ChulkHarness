[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chulkharness"
dynamic = ["version"]
description = "A lightweight Python agent harness with explicit state, tools, memory, skills, and traces."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ChulkHarness contributors" }]
keywords = ["agents", "llm", "tools", "memory", "tracing", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "croniter>=6,<7",
  "packaging>=24,<27",
  "python-dateutil>=2.9,<3",
  "PyYAML>=6.0.2,<7",
  "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.urls]
Homepage = "https://github.com/JaviChulvi/ChulkHarness"
Repository = "https://github.com/JaviChulvi/ChulkHarness"
Issues = "https://github.com/JaviChulvi/ChulkHarness/issues"
Changelog = "https://github.com/JaviChulvi/ChulkHarness/blob/main/CHANGELOG.md"
Security = "https://github.com/JaviChulvi/ChulkHarness/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "httpx>=0.28,<1",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.14,<0.15",
  "mypy>=1.11",
  "setuptools>=77",
  "types-PyYAML>=6.0.12",
  "types-croniter>=6.0.0",
  "types-python-dateutil>=2.9.0",
  "starlette>=0.46,<1",
  "uvicorn>=0.34,<1",
]
openai = [
  "openai>=1.109.0",
]
anthropic = [
  "anthropic>=0.64.0",
]
gemini = [
  "google-genai>=2.10.0",
]
providers = [
  "openai>=1.109.0",
  "anthropic>=0.64.0",
  "google-genai>=2.10.0",
]
mcp = [
  "mcp>=1.27,<2",
]
server = [
  "starlette>=0.46,<1",
  "uvicorn>=0.34,<1",
]
discord = [
  "discord.py>=2.5,<3",
]

[project.scripts]
chulk = "chulk.main:main"
chulk-telegram = "chulk.telegram.main:main"
chulk-discord = "chulk.discord.main:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.dynamic]
version = {attr = "chulk._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["chulk*"]
exclude = ["chulk.tests*", "chulkharness.egg-info*"]

[tool.setuptools.package-data]
"chulk" = ["py.typed"]
"chulk.presets" = ["AGENT.md"]
"chulk.skills" = ["bundled/*/SKILL.md"]
"chulk.server" = ["webchat/*.html", "webchat/*.css", "webchat/*.js"]

[tool.pytest.ini_options]
testpaths = ["chulk/tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["chulk"]
omit = ["chulk/tests/*"]

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
follow_imports = "silent"
warn_unused_configs = true
warn_redundant_casts = true
exclude = ["build", "dist", "chulk/tests"]
