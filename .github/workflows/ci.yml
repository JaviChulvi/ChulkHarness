name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install -e ".[dev,providers,mcp]"

      - name: Run tests with production coverage
        run: python -m pytest --cov=chulk --cov-report=term-missing

      - name: Lint
        run: python -m ruff check .

      - name: Typecheck package and external consumer
        run: python -m mypy chulk typing_tests

      - name: Compile package
        run: python -m compileall chulk

      - name: Verify documentation contract
        run: python scripts/check_docs.py

      - name: Run credential-free SDK examples
        env:
          CHULK_EXAMPLE_RUNTIME_DIR: ${{ runner.temp }}/chulk-examples
        run: |
          python examples/00_sdk_quickstart.py
          python examples/repo_review_bot/app.py

      - name: Build and verify clean wheel
        run: |
          python -m build --wheel --outdir dist
          python scripts/check_wheel_install.py dist/*.whl --examples-dir examples

  compatibility:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Python 3.12
            os: windows-latest
            python-version: "3.12"
          - name: Ubuntu Python 3.13
            os: ubuntu-latest
            python-version: "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install -e ".[dev,openai]"

      - name: Run offline suite
        run: python -m pytest

      - name: Build and verify clean wheel on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m build --wheel --outdir dist
          $wheel = Get-ChildItem -Path "dist/*.whl" | Select-Object -First 1
          if ($null -eq $wheel) { throw "Built wheel was not found" }
          python scripts/check_wheel_install.py $wheel.FullName --examples-dir examples
