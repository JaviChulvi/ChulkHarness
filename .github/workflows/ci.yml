name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            extras: "providers,mcp"
            coverage: true
          - python-version: "3.12"
            extras: "openai"
            coverage: false
          - python-version: "3.13"
            extras: "openai"
            coverage: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,${{ matrix.extras }}]"

      - name: Run tests with production coverage
        if: matrix.coverage
        run: python -m pytest --cov=chulk --cov-report=term-missing

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: python -m pytest

      - name: Compile package
        run: python -m compileall src/chulk

      - name: Lint
        run: python -m ruff check .

  typecheck:
    name: Typecheck public SDK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,providers,mcp,postgres]"

      - name: Typecheck package, examples, and external consumer
        run: python -m mypy src/chulk examples typing_tests

      - name: Verify documentation contract
        run: python scripts/check_docs.py

      - name: Run credential-free SDK examples
        env:
          CHULK_EXAMPLE_RUNTIME_DIR: ${{ runner.temp }}/chulk-examples
        run: |
          python examples/00_sdk_quickstart.py
          python examples/repo_review_bot/app.py

  eval:
    name: Deterministic agent quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Run credential-free agent evaluation
        env:
          CHULK_PROJECT_ROOT: ${{ runner.temp }}/chulk-eval
        run: >-
          chulk eval run examples/evaluation_suite/app.py:suite
          --output evaluation-report.xml --format junit --json

      - name: Upload evaluation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-evaluation-report-${{ github.sha }}
          path: evaluation-report.xml
          if-no-files-found: warn
          retention-days: 14

  postgres:
    name: PostgreSQL hosted contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chulk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chulk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL reference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      - name: Run real PostgreSQL contract suite
        env:
          CHULK_POSTGRES_TEST_URL: >-
            postgresql+psycopg://postgres:postgres@localhost:5432/chulk
        run: python -m pytest tests/test_postgres_reference.py -q

      - name: Run PostgreSQL hosted example
        env:
          CHULK_POSTGRES_URL: >-
            postgresql+psycopg://postgres:postgres@localhost:5432/chulk
        run: python examples/hosted_runtime/postgres_app.py

  windows:
    name: Windows Python 3.12
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,openai]"

      - name: Run offline suite
        run: python -m pytest

      - name: Compile package
        run: python -m compileall src/chulk

      - name: Lint
        run: python -m ruff check .

      - name: Build and verify clean wheel
        shell: pwsh
        run: |
          python -m build --wheel --outdir dist
          $wheel = Get-ChildItem -Path "dist/*.whl" | Select-Object -First 1
          if ($null -eq $wheel) { throw "Built wheel was not found" }
          python scripts/check_wheel_install.py $wheel.FullName --examples-dir examples

  package:
    name: Clean wheel and examples
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2"

      - name: Build wheel
        run: python -m build --wheel --outdir dist

      - name: Verify clean wheel, resources, and examples
        run: python scripts/check_wheel_install.py dist/*.whl --examples-dir examples

      - name: Read verified wheel version
        id: wheel-version
        run: |
          version="$(python -c 'import sys; from pathlib import Path; from packaging.utils import parse_wheel_filename; print(parse_wheel_filename(Path(sys.argv[1]).name)[1])' dist/*.whl)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Generate wheel checksum
        run: |
          cd dist
          sha256sum -- *.whl > SHA256SUMS

      - name: Upload verified wheel
        uses: actions/upload-artifact@v4
        with:
          name: chulkharness-wheel-${{ steps.wheel-version.outputs.version }}-${{ github.sha }}
          path: |
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
