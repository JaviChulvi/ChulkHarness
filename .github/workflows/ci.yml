name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Ubuntu Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chulk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chulk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,providers,mcp,postgres]"

      - name: Run tests with production coverage
        env:
          CHULK_POSTGRES_TEST_URL: >-
            postgresql+psycopg://postgres:postgres@localhost:5432/chulk
        run: python -m pytest --cov=chulk --cov-report=term-missing

      - name: Run static and documentation checks
        run: |
          python -m ruff check .
          python -m mypy src/chulk examples typing_tests
          python -m compileall src/chulk
          python scripts/check_docs.py

      - name: Run credential-free examples and evaluation
        env:
          CHULK_EXAMPLE_RUNTIME_DIR: ${{ runner.temp }}/chulk-examples
          CHULK_POSTGRES_URL: >-
            postgresql+psycopg://postgres:postgres@localhost:5432/chulk
          CHULK_PROJECT_ROOT: ${{ runner.temp }}/chulk-eval
        run: |
          python examples/00_sdk_quickstart.py
          python examples/repo_review_bot/app.py
          python examples/hosted_runtime/postgres_app.py
          chulk eval run examples/evaluation_suite/app.py:suite \
            --output evaluation-report.xml --format junit --json

      - name: Build and verify clean wheel
        run: |
          python -m build --wheel --outdir dist
          python scripts/check_wheel_install.py dist/*.whl --examples-dir examples

      - name: Read verified wheel version
        if: github.event_name == 'push'
        id: wheel-version
        run: |
          version="$(python -c 'import sys; from pathlib import Path; from packaging.utils import parse_wheel_filename; print(parse_wheel_filename(Path(sys.argv[1]).name)[1])' dist/*.whl)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Generate wheel checksum
        if: github.event_name == 'push'
        run: |
          cd dist
          sha256sum -- *.whl > SHA256SUMS

      - name: Upload verified wheel
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: chulkharness-wheel-${{ steps.wheel-version.outputs.version }}-${{ github.sha }}
          path: |
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
