name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            extras: "providers,mcp"
            coverage: true
          - python-version: "3.12"
            extras: "openai"
            coverage: false
          - python-version: "3.13"
            extras: "openai"
            coverage: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,${{ matrix.extras }}]"

      - name: Run tests with production coverage
        if: matrix.coverage
        run: python -m pytest --cov=chulk --cov-report=term-missing

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: python -m pytest

      - name: Compile package
        run: python -m compileall chulk

      - name: Lint
        run: python -m ruff check .

  typecheck:
    name: Typecheck public SDK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,providers,mcp]"

      - name: Typecheck package and external consumer
        run: python -m mypy chulk typing_tests

      - name: Verify documentation contract
        run: python scripts/check_docs.py

      - name: Run credential-free SDK examples
        env:
          CHULK_EXAMPLE_RUNTIME_DIR: ${{ runner.temp }}/chulk-examples
        run: |
          python examples/00_sdk_quickstart.py
          python examples/repo_review_bot/app.py

  windows:
    name: Windows Python 3.12
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,openai]"

      - name: Run offline suite
        run: python -m pytest

      - name: Compile package
        run: python -m compileall chulk

      - name: Lint
        run: python -m ruff check .

      - name: Build and verify clean wheel
        shell: pwsh
        run: |
          python -m build --wheel --outdir dist
          $wheel = Get-ChildItem -Path "dist/*.whl" | Select-Object -First 1
          if ($null -eq $wheel) { throw "Built wheel was not found" }
          python scripts/check_wheel_install.py $wheel.FullName --examples-dir examples

  package:
    name: Clean wheel and examples
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2"

      - name: Build wheel
        run: python -m build --wheel --outdir dist

      - name: Verify clean wheel, resources, and examples
        run: python scripts/check_wheel_install.py dist/*.whl --examples-dir examples
